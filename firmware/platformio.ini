; Tripper DIY firmware. Spec: docs/build/firmware.md.
; Envs: waveshare128 (Path A), devkit_n16r8 (Path B), native (host unit tests for lib/navcore).

[platformio]
default_envs = waveshare128

; Shared by the ESP32-S3 boards only. The native env must not inherit this
; (it would pick up framework = arduino and fail).
[esp32s3]
platform = platformio/espressif32@7.1.3
framework = arduino
board = esp32-s3-devkitc-1
; esp32-s3-devkitc-1 defaults to 8 MB; both boards carry 16 MB and the partition table needs it.
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=3
; Display/GNSS/QR libraries are added (with pinned versions) in M1 when first used.

[env:waveshare128]
extends = esp32s3
board_build.arduino.memory_type = qio_qspi   ; 2 MB quad PSRAM
build_flags = ${esp32s3.build_flags} -DBOARD_WAVESHARE_128 -DBOARD_HAS_PSRAM

[env:devkit_n16r8]
extends = esp32s3
board_build.arduino.memory_type = qio_opi    ; 8 MB octal PSRAM
build_flags = ${esp32s3.build_flags} -DBOARD_DEVKIT_N16R8 -DBOARD_HAS_PSRAM

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -Werror -DNATIVE
lib_ignore = hal
