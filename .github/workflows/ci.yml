# M0 CI (docs/project-plan.md): navcore native tests, both firmware builds, planner tests, docs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Repo checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: navcore stays pure C++17 (include allowlist)
        run: python3 tools/check_navcore_purity.py
      - name: navcore config in sync between firmware and planner
        run: python3 tools/check_config_sync.py

  firmware-native:
    name: Firmware · navcore native tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: firmware/requirements.txt
      - run: pip install -r firmware/requirements.txt
      - run: pio test -e native
        working-directory: firmware

  firmware-build:
    name: Firmware · build ${{ matrix.env }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        env: [waveshare128, devkit_n16r8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: firmware/requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          # ~1-2 GB toolchain. Partial restores are safe: PlatformIO fetches only what's missing.
          key: pio-esp32-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'firmware/requirements.txt') }}
          restore-keys: |
            pio-esp32-${{ runner.os }}-
      - run: pip install -r firmware/requirements.txt
      - run: pio run -e ${{ matrix.env }}
        working-directory: firmware

  planner:
    name: Planner · typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: planner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: planner/.nvmrc
          cache: npm
          cache-dependency-path: planner/package-lock.json
      - run: npm ci --ignore-scripts # no dependency lifecycle scripts on PR code
      - run: npm test
      - run: npm run build # tsc --noEmit + vite build

  docs:
    name: Docs · mkdocs --strict
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
